name: platform-deploy

on:
  # Normal promotion runs PLAN only. No infrastructure is created by a merge.
  push:
    branches:
      - dev
      - stage
      - uat
      - main
    paths:
      - "CloudOpsTracker.API/**"
      - "CloudOpsTracker.Web/**"
      - "infra/platform/**"
      - "infra/modules/**"
      - "infra/environments/**/platform.tfvars"
      - ".github/workflows/platform.yml"

  # APPLY, ROLLBACK and DESTROY are explicit manual operations.
  workflow_dispatch:
    inputs:
      action:
        description: "Operation for the selected branch/environment"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - rollback
          - destroy

      rollback_ref:
        description: "For rollback only: prior commit SHA or Git tag from this branch"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  resolve-target:
    name: Resolve branch to AWS environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.target.outputs.environment }}
      action: ${{ steps.target.outputs.action }}
      rollback_ref: ${{ steps.target.outputs.rollback_ref }}

    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          set -euo pipefail

          case "${CURRENT_BRANCH}" in
            dev)   TARGET_ENVIRONMENT="dev" ;;
            stage) TARGET_ENVIRONMENT="stage" ;;
            uat)   TARGET_ENVIRONMENT="uat" ;;
            main)  TARGET_ENVIRONMENT="prod" ;;
            *)
              echo "Branch '${CURRENT_BRANCH}' is not an approved deployment branch."
              exit 1
              ;;
          esac

          if [[ "${EVENT_NAME}" == "push" ]]; then
            TERRAFORM_ACTION="plan"
          else
            TERRAFORM_ACTION="${REQUESTED_ACTION}"
          fi

          if [[ "${TERRAFORM_ACTION}" == "rollback" && -z "${REQUESTED_ROLLBACK_REF}" ]]; then
            echo "rollback_ref is required when action=rollback."
            exit 1
          fi

          echo "environment=${TARGET_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "action=${TERRAFORM_ACTION}" >> "$GITHUB_OUTPUT"
          echo "rollback_ref=${REQUESTED_ROLLBACK_REF}" >> "$GITHUB_OUTPUT"

          echo "Branch: ${CURRENT_BRANCH}"
          echo "Environment: ${TARGET_ENVIRONMENT}"
          echo "Operation: ${TERRAFORM_ACTION}"

          if [[ "${TERRAFORM_ACTION}" == "rollback" ]]; then
            echo "Rollback ref: ${REQUESTED_ROLLBACK_REF}"
          fi

  terraform:
    name: Platform ${{ needs.resolve-target.outputs.environment }} - ${{ needs.resolve-target.outputs.action }}
    needs: resolve-target
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-target.outputs.environment }}

    concurrency:
      group: cloudopstracker-platform-${{ needs.resolve-target.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate rollback ref
        if: ${{ needs.resolve-target.outputs.action == 'rollback' }}
        shell: bash
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
          ROLLBACK_REF: ${{ needs.resolve-target.outputs.rollback_ref }}
        run: |
          set -euo pipefail

          git fetch origin "${CURRENT_BRANCH}" --prune

          ROLLBACK_SHA="$(git rev-parse --verify "${ROLLBACK_REF}^{commit}")"

          if ! git merge-base --is-ancestor "${ROLLBACK_SHA}" "origin/${CURRENT_BRANCH}"; then
            echo "Rollback ref '${ROLLBACK_REF}' is not in the history of '${CURRENT_BRANCH}'."
            exit 1
          fi

          echo "Validated rollback commit: ${ROLLBACK_SHA}"

      - name: Checkout rollback version
        if: ${{ needs.resolve-target.outputs.action == 'rollback' }}
        shell: bash
        env:
          ROLLBACK_REF: ${{ needs.resolve-target.outputs.rollback_ref }}
        run: |
          set -euo pipefail
          git checkout --detach "${ROLLBACK_REF}"
          echo "Rollback source:"
          git --no-pager log -1 --oneline

      - name: Load project configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          source infra/project.env

          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "name_prefix=${NAME_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "iam_name_prefix=${IAM_NAME_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.aws_region }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Resolve Terraform state bucket
        id: state
        shell: bash
        env:
          NAME_PREFIX: ${{ steps.config.outputs.name_prefix }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "bucket=${NAME_PREFIX}-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Terraform init
        working-directory: infra/platform
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=${{ needs.resolve-target.outputs.environment }}/platform.tfstate" \
            -backend-config="region=${{ steps.config.outputs.aws_region }}"

      - name: Terraform validate
        working-directory: infra/platform
        run: terraform validate -no-color

      - name: Terraform plan
        if: ${{ needs.resolve-target.outputs.action != 'destroy' }}
        working-directory: infra/platform
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            -var="aws_region=${{ steps.config.outputs.aws_region }}" \
            -var="name_prefix=${{ steps.config.outputs.name_prefix }}" \
            -var="iam_name_prefix=${{ steps.config.outputs.iam_name_prefix }}" \
            -var-file="../environments/${{ needs.resolve-target.outputs.environment }}/platform.tfvars"

      - name: Terraform destroy plan
        if: ${{ needs.resolve-target.outputs.action == 'destroy' }}
        working-directory: infra/platform
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -out=tfplan \
            -var="aws_region=${{ steps.config.outputs.aws_region }}" \
            -var="name_prefix=${{ steps.config.outputs.name_prefix }}" \
            -var="iam_name_prefix=${{ steps.config.outputs.iam_name_prefix }}" \
            -var-file="../environments/${{ needs.resolve-target.outputs.environment }}/platform.tfvars"

      - name: Show rollback plan summary
        if: ${{ needs.resolve-target.outputs.action == 'rollback' }}
        working-directory: infra/platform
        shell: bash
        env:
          ROLLBACK_REF: ${{ needs.resolve-target.outputs.rollback_ref }}
        run: |
          set -euo pipefail
          echo "Rolling back environment '${{ needs.resolve-target.outputs.environment }}'"
          echo "Rollback source: ${ROLLBACK_REF}"
          terraform show -no-color tfplan | tail -n 80

      - name: Capture custom AMI snapshots before destroy
        id: ami_cleanup
        if: ${{ needs.resolve-target.outputs.action == 'destroy' }}
        working-directory: infra/platform
        shell: bash
        run: |
          set -euo pipefail

          AMI_ID="$(terraform output -raw app_ami_id 2>/dev/null || true)"

          if [[ -z "${AMI_ID}" ]]; then
            echo "snapshot_ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SNAPSHOT_IDS="$(aws ec2 describe-images \
            --image-ids "${AMI_ID}" \
            --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' \
            --output text 2>/dev/null || true)"

          echo "snapshot_ids=${SNAPSHOT_IDS}" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        if: ${{ needs.resolve-target.outputs.action == 'apply' }}
        working-directory: infra/platform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform rollback
        if: ${{ needs.resolve-target.outputs.action == 'rollback' }}
        working-directory: infra/platform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ needs.resolve-target.outputs.action == 'destroy' }}
        working-directory: infra/platform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Delete captured AMI snapshots
        if: ${{ needs.resolve-target.outputs.action == 'destroy' && steps.ami_cleanup.outputs.snapshot_ids != '' }}
        shell: bash
        env:
          SNAPSHOT_IDS: ${{ steps.ami_cleanup.outputs.snapshot_ids }}
        run: |
          set -euo pipefail

          for SNAPSHOT_ID in ${SNAPSHOT_IDS}; do
            echo "Deleting ${SNAPSHOT_ID}"
            aws ec2 delete-snapshot --snapshot-id "${SNAPSHOT_ID}" || true
          done

      - name: Show platform outputs
        if: ${{ needs.resolve-target.outputs.action == 'apply' || needs.resolve-target.outputs.action == 'rollback' }}
        working-directory: infra/platform
        run: terraform output

name: security-ci

on:
  pull_request:
    branches:
      - dev
      - stage
      - uat
      - main
    paths:
      - "CloudOpsTracker.API/**"
      - "CloudOpsTracker.Web/**"
      - "infra/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v7

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true
          output_format: cli

  trivy:
    name: Trivy repository scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v7

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  sonarcloud:
    name: SonarCloud code analysis
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Run SonarCloud
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}"

          dotnet build CloudOpsTracker.sln -c Release

          dotnet sonarscanner end \
            /d:sonar.token="${SONAR_TOKEN}"

      - name: SonarCloud not configured yet
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == '' }}
        run: |
          echo "SonarCloud scan skipped."
          echo "Add repository secret SONAR_TOKEN and variables SONAR_PROJECT_KEY + SONAR_ORGANIZATION to enable it."

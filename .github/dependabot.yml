version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directories:
      - /CloudOpsTracker.API
      - /CloudOpsTracker.Web
      - /CloudOpsTracker.Tests
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dotnet-servicing:
        patterns: ["Microsoft.*", "System.*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
